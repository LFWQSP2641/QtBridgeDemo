name: Build

on: push

env:
  QT_VERSION: '6.12.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Get cmake
      uses: lukka/get-cmake@latest

    - uses: TheMrMilchmann/setup-msvc-dev@v3
      with:
        arch: x64

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        cache: 'true'
        version: ${{ env.QT_VERSION }}
        aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        tools: 'tools_ninja tools_cmake tools_vcredist,qt.tools.vcredist_msvc2022_x64'

    - name: Build
      run: |
        dotnet build -c Release -p:Platform="Any CPU"

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: build
        path: QtBridgeDemo/bin/Release/net10.0/
